apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-node-port
spec:
  type: NodePort
  selector:
    app: {{ .Values.labels.app | default "devops-project" }}
    tier: {{ .Values.labels.tier | default "backend" }}
    name: {{ .Values.labels.name | default "task_api" }}
  ports:
    - port: {{ .Values.ports.port | default 80 }}
      targetPort: {{ .Values.ports.containerPort | default 8000 }}
      nodePort: {{ .Values.ports.nodePort | default 30001 }}