version: "3.9"

services:
  task_api:
    image: jkole822/devops-project-task-api:latest
    build: .
    container_name: fastapi_app
    command: [ "./wait-for-postgres.sh", "tasks_db", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      - AUTH_URL=${AUTH_URL}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - tasks_db
      - redis
    networks:
      - dev-ops-project-network

  tasks_db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - task_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 2s
      retries: 10
    networks:
      - dev-ops-project-network

  redis:
    image: redis:7
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dev-ops-project-network

  migrate:
    image: jkole822/devops-project-task-migration:latest
    build: .
    command: [ "./wait-for-postgres.sh", "tasks_db", "alembic", "upgrade", "head" ]
    volumes:
      - .:/code
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
    depends_on:
      tasks_db:
        condition: service_healthy
    networks:
      - dev-ops-project-network

volumes:
  task_postgres_data:
  redis_data:

networks:
  dev-ops-project-network:
    external: true
