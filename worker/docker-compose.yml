version: "3.9"

services:
  worker:
    image: jkole822/devops-project-worker:latest
    build: .
    container_name: redis_worker
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      - REDIS_URL=${REDIS_URL}
    networks:
      - dev-ops-project-network

networks:
  dev-ops-project-network:
    external: true